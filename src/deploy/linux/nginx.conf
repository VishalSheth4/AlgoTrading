# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf  —  Reverse proxy for AlgoTrading dashboard (optional)
#
# Puts nginx in front of the Django/gunicorn server.
# Advantages: SSL termination, compression, static file caching.
#
# Install nginx:  sudo apt install nginx
# Copy config:    sudo cp nginx.conf /etc/nginx/sites-available/algotrading
#                 sudo ln -s /etc/nginx/sites-available/algotrading /etc/nginx/sites-enabled/
#                 sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain or server IP.
# ─────────────────────────────────────────────────────────────────────────────

upstream algotrading {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP → HTTPS (uncomment once you have a cert)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/algotrading_access.log;
    error_log  /var/log/nginx/algotrading_error.log;

    # Increase timeouts for long analytics requests
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://algotrading;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache JS library files for 24h
        location ~* /static/.*\.(js|css)$ {
            proxy_pass       http://algotrading;
            proxy_cache_valid 200 24h;
            add_header       Cache-Control "public, max-age=86400";
        }
    }
}

# HTTPS block (enable after: sudo certbot --nginx -d YOUR_DOMAIN)
# server {
#     listen 443 ssl http2;
